# Hosting approval, a successful ci.jenkins.io check and Jenkins-managed secrets are required.
name: Release

on:
  workflow_dispatch:
    inputs:
      validate_only:
        description: Validate release configuration without publishing
        required: false
        type: boolean
        default: true

permissions:
  checks: read
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  maven-cd:
    if: github.repository == 'jenkinsci/octane-status-tracker-plugin' && github.ref == 'refs/heads/main'
    uses: jenkins-infra/github-reusable-workflows/.github/workflows/maven-cd.yml@c2470861b1ad94810dc0d207b011e0b57bb91bbb # v1
    with:
      validate_only: ${{ inputs.validate_only == true }}
    secrets:
      MAVEN_USERNAME: ${{ secrets.MAVEN_USERNAME }}
      MAVEN_TOKEN: ${{ secrets.MAVEN_TOKEN }}
